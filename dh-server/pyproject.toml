[project]
name = "dh-server"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  # .env parsing for pydantic-settings and scripts/migrate_minimax_env_to_db.py.
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pillow>=10.0",
  "aiortc>=1.9",
  # MiniMax TTS calls (dh_server/tts/minimax.py); also what TestClient needs.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "httpx2"]
# The runtime subset of MuseTalk's own requirements.txt, minus what only its
# training and demo scripts need: tensorflow/tensorboard, gradio, gdown,
# moviepy, ffmpeg-python, and the SyncNet checkpoint. Those are also what pinned
# numpy==1.23.5 and made the file unresolvable on cp311+.
#
# torch/torchvision are NOT listed here: they must come from the cu128 index
# (no cu126-or-earlier wheel carries sm_120 kernels for the RTX 50 series).
# scripts/setup_musetalk.sh installs them first, from the right index.
musetalk = [
  "numpy>=2.0",
  "scipy>=1.13",
  "opencv-python>=4.10",
  "pillow>=10.0",
  "mediapipe>=0.10",
  "diffusers>=0.30",
  "transformers>=4.39",
  # diffusers loads the VAE with low_cpu_mem_usage=True when accelerate is
  # present; without it every load prints a fallback warning and spikes RAM.
  "accelerate>=1.0",
  "huggingface-hub>=0.30",
  "safetensors>=0.4",
  "einops>=0.8",
  "librosa>=0.11",
  "soundfile>=0.12",
  # diffusers' Wan pipeline (Wan 2.x) calls ``ftfy.fix_text`` without importing
  # the module -- a known omission in some pipeline files. Ship it explicitly
  # so the first ``pipe(...)`` call doesn't crash with NameError.
  "ftfy>=6.0",
]
# The `wav2lip` engine. It is a strict subset of the musetalk runtime's
# needs, minus the heavy training/inference extras (diffusers, transformers,
# mediapipe): opencv for the frames, librosa + scipy for the mel
# spectrogram, tqdm for the detector's progress bar.
#
# torch is deliberately NOT listed: a CPU-only box wants the CPU wheel, a GPU
# box wants the CUDA one, and neither is the default pip resolution. Install
# it from the index you want, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
wav2lip = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "librosa>=0.11",
  "scipy>=1.13",
  "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "dh_server.__version__" }

[tool.setuptools.packages.find]
include = ["dh_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::ResourceWarning"]
# Both markers are deselected by default so `pytest` in the torch-free .venv
# never needs a GPU. `-m gpu` / `-m musetalk` in .venv-musetalk opts back in.
# `pytest.importorskip("torch")` is the second line of defence: it makes the
# torch-dependent tests skip cleanly even when someone runs `-m ""` or
# `-m gpu` from the wrong interpreter. It is per-module in the `_gpu` files
# and per-test in the animator / VRAM files, which lazy-import torch by
# design -- a module-level skip there would take the torch-free contract
# tests down with it.
markers = [
  "gpu: needs a CUDA device and the real weights (run in .venv-musetalk)",
  "musetalk: needs the MuseTalk runtime dependencies (run in .venv-musetalk)",
]
addopts = "-m 'not gpu and not musetalk'"
